name: Daily R snapshots

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-r-snapshots

jobs:
  extract:
    name: Extract R-${{ matrix.r_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r_version: [next, devel]
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r_version }}

      - name: Extract snapshot
        env:
          RCHEOLOGY_OUTPUT_FILE: ${{ matrix.r_version }}.csv
          RCHEOLOGY_HELP_OUTPUT_FILE: help-${{ matrix.r_version }}.RData
        run: Rscript guest-list-objects.R

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.r_version }}
          path: |
            ${{ matrix.r_version }}.csv
            help-${{ matrix.r_version }}.RData
          retention-days: 1

  publish:
    name: Build and publish
    needs: extract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::dplyr, any::DT, any::purrr, any::readr, any::rsconnect, any::shiny
          cache-version: 3
          needs: check

      - uses: actions/download-artifact@v4
        with:
          pattern: snapshot-*
          path: daily-input
          merge-multiple: true

      - name: Build daily data
        run: |
          cp daily-input/* docker-data
          Rscript write-package-data.R
          Rscript build-daily-package.R daily-dist
          Rscript make-app-data.R

      - name: Check and package
        shell: Rscript {0}
        run: |
          devtools::check(document = FALSE, args = "--no-manual", error_on = "warning")
          tarball <- devtools::build(path = "daily-dist", manual = FALSE, vignettes = FALSE)
          stopifnot(file.rename(tarball, "daily-dist/rcheology-daily.tar.gz"))

      - name: Compress CSV
        run: gzip -9 daily-dist/rcheology-daily.csv

      - name: Update daily branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin daily
          # Update the branch separately, leaving the build outputs in place.
          git worktree add --detach daily-branch origin/daily
          git -C daily-branch merge --strategy=ours --no-edit origin/master
          git -C daily-branch restore --source=origin/master --staged --worktree .
          cp data/rcheology.rda daily-branch/data/
          mkdir -p daily-branch/inst
          cp inst/rcheology-help.rds daily-branch/inst/
          cp DESCRIPTION daily-branch/
          git -C daily-branch add data/rcheology.rda inst/rcheology-help.rds DESCRIPTION
          git -C daily-branch commit --allow-empty -m "Daily snapshots $(date -u +%F)"
          git -C daily-branch push origin HEAD:daily

      - name: Upload release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload daily-release --clobber daily-dist/*

      - name: Deploy app
        shell: Rscript {0}
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          RENV_CONFIG_REPOS_OVERRIDE: CRAN=https://cloud.r-project.org
        run: |
          options(rsconnect.packrat = TRUE)
          rsconnect::setAccountInfo(
            name = "hughjonesd",
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          rsconnect::deployApp(
            "app",
            appFiles = c(
              "app.R",
              "rcheology-app-data.RData",
              "rcheology-help.rds"
            ),
            appName = "rcheology",
            account = "hughjonesd",
            packageRepositoryResolutionR = "lockfile",
            forceUpdate = TRUE
          )
