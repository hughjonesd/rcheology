name: Historical R help

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: historical-r-help
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Build historical help
        run: |
          ./host-run-on-evercran.sh --html-help
          Rscript host-html-help.R

      - name: Prepare Pages site
        run: |
          mkdir site
          mv help-site site/help
          printf '%s\n' \
            '<!doctype html><meta http-equiv="refresh" content="0; url=help/">' \
            '<a href="help/">Historical R help</a>' > site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
